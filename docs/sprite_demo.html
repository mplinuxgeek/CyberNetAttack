<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprite demo</title>
<style>
  body{margin:0;background:#0b1220;color:#cfe0f5;font:14px system-ui,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:12px 18px;background:#111b2e;border-bottom:1px solid #22314d}
  header label{display:flex;gap:8px;align-items:center}
  section{padding:16px 24px 8px;border-bottom:1px solid #1a2840}
  section h2{margin:0 0 2px;font-size:16px;color:#e8f1ff}
  section h2 span{font-weight:400;color:#7f97ba;font-size:12px;margin-left:8px}
  .row{display:flex;gap:26px;align-items:flex-end;padding:12px 0 16px;overflow-x:auto}
  .card{display:flex;flex-direction:column;align-items:center;gap:8px}
  .card canvas{image-rendering:pixelated;background:#162238;border:1px solid #22314d;border-radius:6px}
  .card small{color:#8aa2c4}
  .card h3{margin:0;font-size:12px;color:#c7d8f0;font-weight:600}
  .sep{align-self:stretch;width:1px;background:#22314d}
  h1{margin:0;font-size:15px}
  .group{padding:14px 24px 0;color:#7f97ba;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
</style></head>
<body>
<header>
  <h1>Sprite demo</h1>
  <label>Speed <input id="fps" type="range" min="2" max="24" value="10"><span id="fpsv">10 fps</span></label>
  <label>Scale <input id="scale" type="range" min="1" max="8" value="3"><span id="scalev">3x</span></label>
  <label><input id="ground" type="checkbox" checked> ground line</label>
</header>
<div id="list"></div>
<script src="../assets/sprites/manifest.js"></script>
<script>
const MAN = window.SPRITE_MANIFEST || {}, BASE = '../assets/sprites/';
const LABEL = {'resistance_rifleman': 'Rifleman (steel helmet)', 'resistance_captain': 'Captain (field cap)', 'resistance_goggles': 'Rifleman (goggles, backpack)', 'resistance_shotgunner': 'Shotgunner (bandana, braid)', 'resistance_signaller': 'Signaller (headset, antenna)', 'resistance_tech': 'Tech Operative', 'resistance_heavy': 'Ordnance Gunner', 'resistance_medic': 'Scavenger (medic)', 't800': 'T-800 Endoskeleton', 't800_infiltrator': 'T-800 Infiltrator (damaged)', 't800_minigun': 'T-800 Endoskeleton (minigun)', 't800_crawler': 'T-800 Crawler', 't800_reprogrammed': 'Reprogrammed T-800', 't47': 'T-47', 't1': 'T-1', 'hk_tank': 'HK-Tank', 'hk_tank_light': 'HK-Tank (Light)', 'hk_aerial': 'HK-Aerial', 'aerostat': 'Aerostat', 'harvester': 'Harvester', 'ogre': 'The Ogre', 'skynet': 'Skynet Core'};
const $ = id => document.getElementById(id);
const imgs = {};
const load = f => imgs[f] || (imgs[f] = Object.assign(new Image(), { src: BASE + f }));
const order = ['s', 'n', 'ne', 'nw', 'e', 'se', 'sw', 'w'];
const frames = (u, k) => { const v = MAN[u].dirs[k]; return v.files || v; };
const units = [];   // { cards:[{cv, files}] }

const names = Object.keys(MAN).filter(n => Object.keys(MAN[n].dirs || {}).some(k => order.includes(k))), animated = n => Object.values(MAN[n].dirs || {}).some(v => (v.files || v).length > 1);
const sections = [['Animated', names.filter(animated)], ['Single frame / placeholder', names.filter(n => !animated(n))]];
const list = $('list');
for (const [title, ns] of sections) {
  if (!ns.length) continue;
  const g = document.createElement('div'); g.className = 'group'; g.textContent = title; list.appendChild(g);
  for (const n of ns) addUnit(n);
}
function addUnit(n) {
  const sec = document.createElement('section'), h = document.createElement('h2'), row = document.createElement('div'); row.className = 'row';
  h.innerHTML = (LABEL[n] || n) + '<span>' + n + '</span>'; sec.append(h, row); list.appendChild(sec);
  const keys = Object.keys(MAN[n].dirs).filter(k => order.includes(k)).sort((a, b) => order.indexOf(a) - order.indexOf(b));
  const u = { cards: [] }; units.push(u);
  const still = keys.includes('s') && frames(n, 's').length === 1 ? 's' : null;
  if (still) { card(row, u, still, [frames(n, still)[0]], 'static'); const sp = document.createElement('div'); sp.className = 'sep'; row.appendChild(sp); }
  for (const k of keys) { if (k === still) continue; card(row, u, k, frames(n, k), frames(n, k).length > 1 ? frames(n, k).length + ' frames' : 'static'); }
}
function card(row, u, k, files, sub) {
  const c = document.createElement('div'); c.className = 'card';
  const cv = document.createElement('canvas'), t = document.createElement('h3'), s = document.createElement('small');
  t.textContent = k.toUpperCase(); s.textContent = sub; c.append(t, cv, s); row.appendChild(c);
  u.cards.push({ cv, files: files.map(load) });
}
function draw(t) {
  const want = +$('scale').value, fps = +$('fps').value, ground = $('ground').checked;
  for (const u of units) {
    let W = 1, H = 1;   // one canvas size per unit so every view shares the same baseline
    for (const c of u.cards) for (const im of c.files) if (im.complete && im.naturalWidth) { W = Math.max(W, im.naturalWidth); H = Math.max(H, im.naturalHeight); }
    const sc = Math.max(1, Math.min(want, Math.floor(380 / H)));   // big placeholder art is shrunk to fit
    for (const c of u.cards) {
      const cv = c.cv; if (cv.width !== W * sc || cv.height !== H * sc + 10) { cv.width = W * sc; cv.height = H * sc + 10; }
      const x = cv.getContext('2d'); x.imageSmoothingEnabled = false; x.clearRect(0, 0, cv.width, cv.height);
      if (ground) { x.fillStyle = 'rgba(120,160,220,.25)'; x.fillRect(0, H * sc + 4, cv.width, 2); }
      const im = c.files[Math.floor(t / 1000 * fps) % c.files.length];
      if (im.complete && im.naturalWidth) x.drawImage(im, Math.round((W - im.naturalWidth) / 2) * sc, (H - im.naturalHeight) * sc, im.naturalWidth * sc, im.naturalHeight * sc);
    }
  }
  requestAnimationFrame(draw);
}
$('fps').oninput = e => $('fpsv').textContent = e.target.value + ' fps';
$('scale').oninput = e => $('scalev').textContent = e.target.value + 'x';
requestAnimationFrame(draw);
</script></body></html>
