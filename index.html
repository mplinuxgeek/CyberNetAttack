<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cyber Net Attack</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050507">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#050507;overflow:hidden;color:#e8eef5;
    font-family:"Arial Black",Impact,system-ui,sans-serif;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(100vw,60vh);aspect-ratio:3/5;max-height:100vh;
    font-size:calc(min(100vw,60vh)/26)}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;background:#000;}
  #ui{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(4,6,10,.78)}
  .panel{width:86%;max-height:94%;overflow:auto;text-align:center;padding:1.2em 1em;
    border:2px solid #ff5a2a;border-radius:.6em;background:rgba(14,10,12,.92);
    box-shadow:0 0 1.5em rgba(255,90,42,.35)}
  h1{margin:.1em 0 .2em;font-size:2.4em;line-height:1;letter-spacing:.05em;color:#ff5a2a;
    text-shadow:0 0 .5em rgba(255,60,20,.6)}
  h2{margin:.1em 0 .4em;font-size:1.7em;color:#ff5a2a}
  .tag{margin:.2em 0 1em;font-family:system-ui,sans-serif;font-weight:600;color:#9fb3c8;font-size:.8em}
  .foot{margin:1em 0 0;font-family:system-ui,sans-serif;font-size:.65em;color:#778}
  button{font:inherit;font-size:.9em;color:#fff;background:#23303f;border:2px solid #4a627c;
    border-radius:.5em;padding:.6em 1em;margin:.25em;cursor:pointer}
  button:hover:not(:disabled){background:#2f4258}
  button:disabled{opacity:.4;cursor:default}
  button.big{display:block;width:90%;margin:.5em auto;padding:.8em;font-size:1.3em;
    background:#c8381a;border-color:#ff7a4a}
  button.big:hover{background:#e5471f}
  button.row{display:flex;justify-content:space-between;align-items:center;width:100%;
    text-align:left;margin:.3em 0}
  .sel{display:flex;align-items:center;justify-content:center;gap:.6em;margin:.4em 0 .6em}
  .sel small{font-family:system-ui,sans-serif;color:#9fb3c8}
  .pips{letter-spacing:.1em;color:#ff9a4a;font-size:.7em}
  .sl{display:block;font-family:system-ui,sans-serif;font-size:.7em;color:#9fb3c8;margin:.5em 0}
  .sl input{width:60%;vertical-align:middle;accent-color:#ff5a2a}
  .res{font-family:system-ui,sans-serif;font-weight:700;margin:.4em 0;line-height:1.5}
  /* optional arcade CRT: scanlines, phosphor glow, vignette, slight curvature */
  #crtfx{position:absolute;inset:0;pointer-events:none;display:none;z-index:10;border-radius:5% / 3.5%;
    background:
      repeating-linear-gradient(to bottom,rgba(0,0,0,.30) 0,rgba(0,0,0,.30) 1px,rgba(0,0,0,0) 1px,rgba(0,0,0,0) 3px),
      repeating-linear-gradient(to right,rgba(255,40,40,.045) 0,rgba(255,40,40,.045) 1px,rgba(40,255,60,.045) 1px,rgba(40,255,60,.045) 2px,rgba(60,90,255,.045) 2px,rgba(60,90,255,.045) 3px),
      radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(0,0,0,.5) 100%);
    box-shadow:inset 0 0 2.4em rgba(0,0,0,.65),inset 0 0 .6em rgba(120,200,255,.12)}
  #crtfx::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(140,200,255,.10) 0,rgba(140,200,255,0) 70%);mix-blend-mode:screen}
  .crt #crtfx{display:block;animation:crtflick 4s infinite steps(2,end)}
  .crt canvas{filter:contrast(1.14) saturate(1.28) brightness(1.1) blur(.45px)}
  .crt{border-radius:5% / 3.5%;overflow:hidden}
  @keyframes crtflick{0%,100%{opacity:1}50%{opacity:.965}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="336" height="560"></canvas>
  <div id="ui"></div>
  <div id="crtfx"></div>
</div>
<script src="assets/sprites/manifest.js"></script>
<script src="game.js"></script>
<script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
